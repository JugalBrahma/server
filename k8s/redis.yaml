# Redis: the shared answer cache and upload rate-limit counter for every API pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1 # keep at 1: two Redis pods would not share data
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # When full, drop the least-used keys instead of failing writes.
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
---
# The Service name "redis" is the hostname the API uses: redis://redis:6379
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
